name: Build

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "*.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Build plugin
        run: |
          chmod +x gradlew
          ./gradlew make makePluginsJson --no-daemon

      - name: Prepare builds branch
        run: |
          if git ls-remote --exit-code --heads "$REMOTE" builds > /dev/null 2>&1; then
            git clone --depth 1 --branch builds "$REMOTE" "$RUNNER_TEMP/builds"
          else
            git init "$RUNNER_TEMP/builds"
            git -C "$RUNNER_TEMP/builds" checkout --orphan builds
            git -C "$RUNNER_TEMP/builds" remote add origin "$REMOTE"
          fi

      - name: Stage artifacts
        run: |
          BUILDS="$RUNNER_TEMP/builds"
          rm -f "$BUILDS"/*.cs3
          mkdir -p "$BUILDS/AIO-Hentai"
          find . -name '*.cs3' -exec cp -f {} "$BUILDS/" \;
          cp build/plugins.json "$BUILDS/plugins.json"
          cp AIO-Hentai/icon.png "$BUILDS/AIO-Hentai/icon.png"
          ls -lh "$BUILDS"

      - name: Publish builds
        run: |
          cd "$RUNNER_TEMP/builds"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No artifact changes"
          else
            git commit -m "Build $GITHUB_SHA"
            git push origin HEAD:builds
          fi
